name: Build & Release BuildStudio IDE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/BuildStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildStudio-APK
          path: output_apk/BuildStudio.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "BuildStudio IDE v1.0.2 (Fix APK Signing, ZipAlign & Smooth Scroll)"
          body: |
            ## 🚀 BuildStudio IDE Release v1.0.2

            ### 🔧 Key Fixes & Improvements:
            - **Native APK Signing & ZipAlign**: Implemented pure Java 4-byte `ZipAligner` and upgraded testkey certificate to RSA-2048 SHA-256 (resolves "App not installed" error on Android 11-15).
            - **Persistent On-Screen Install Action**: Added a floating Install APK button that persists on screen even after dismissing build logs or returning from file manager.
            - **Buttery Smooth Code Editor**: Optimized `CodeEditorView` onDraw to only render visible lines in the viewport and debounced syntax highlighting for 120 FPS fluid scrolling.
            - **Modern Package Installer Intent**: Enhanced `ApkInstaller` to handle Android 8+ unknown sources permission and Uri file providers seamlessly.
          files: output_apk/BuildStudio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
