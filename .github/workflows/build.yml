name: Build & Release BuildStudio IDE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/BuildStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildStudio-APK
          path: output_apk/BuildStudio.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "BuildStudio IDE v1.0.3 (Fix Malformed Zip in ApkSigner & Smooth Comfortable Scrolling)"
          body: |
            ## 🚀 BuildStudio IDE Release v1.0.3

            ### 🔧 Fixes in this Release:
            - **Fixed `Malformed ZIP entry: AndroidManifest.xml`**: Re-architected `ApkPackager` to perform clean single-pass deflated/stored packaging with exact 4-byte boundaries on uncompressed entries.
            - **Ultra-Comfortable Smooth Scrolling**: Added 260dp bottom overscroll margin, fine-tuned line spacing (1.18x), and enabled native scrollbars for effortless navigation.
            - **SHA-256 Multi-Scheme Signing (V1+V2+V3)**: Verified compatibility with all modern Android versions (Android 8 through Android 15).
          files: output_apk/BuildStudio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
