name: Build & Release BuildStudio IDE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/BuildStudio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildStudio-APK
          path: output_apk/BuildStudio.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "BuildStudio IDE v1.0.4 (MT Manager Grade Smooth Scroll & Full APK Compilation Fix)"
          body: |
            ## 🚀 BuildStudio IDE Release v1.0.4

            ### 🔧 Major Upgrades & Fixes in this Release:
            - **MT Manager Grade Silky-Smooth Scrolling**:
              - Built-in `OverScroller` inertial fling physics for responsive 120 FPS high-refresh scrolling.
              - Multi-touch pinch-to-zoom font scaling (8sp to 32sp).
              - Quick symbol toolbar (`TAB`, `{`, `}`, `(`, `)`, `;`, `"`, `'`, `=`, `.`, etc.).
              - Moved the Install APK button to the top toolbar so the editor viewport is 100% clean and unobstructed.
            - **Full Compiler Pipeline Verification**:
              - Clean single-pass packaging in `ApkPackager` preventing `Malformed ZIP entry` errors.
              - Standard 4-byte ZipAligning on `classes.dex` and `resources.arsc`.
              - Upgraded RSA-2048 SHA-256 testkey supporting Android 8 through 15.
          files: output_apk/BuildStudio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
